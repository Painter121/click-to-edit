<script class="cte-ui">
(function() {
  if (window.__CTE_INITIALIZED__) return;
  window.__CTE_INITIALIZED__ = true;

  const container = document.getElementById('cte-container');
  const fab = document.getElementById('cte-fab');
  const popover = document.getElementById('cte-popover');
  const optClick = document.getElementById('cte-opt-click');
  const optCrop = document.getElementById('cte-opt-crop');
  const optCapture = document.getElementById('cte-opt-capture');
  const optCancel = document.getElementById('cte-opt-cancel');
  const highlightBox = document.getElementById('cte-highlight-box');
  const highlightBadge = document.getElementById('cte-highlight-badge');
  const cropBox = document.getElementById('cte-crop-box');

  const modalBackdrop = document.getElementById('cte-modal-backdrop');
  const modalCloseBtn = document.getElementById('cte-modal-close-btn');
  const modalCancelBtn = document.getElementById('cte-modal-cancel');
  const modalSendBtn = document.getElementById('cte-modal-send');
  const modalHeading = document.getElementById('cte-modal-heading');
  const submitBtnText = document.getElementById('cte-submit-btn-text');
  const instructionInput = document.getElementById('cte-instruction-input');
  const metaBox = document.getElementById('cte-meta-box');
  const multiTargetsWrap = document.getElementById('cte-multi-targets-wrap');
  const multiSelectBar = document.getElementById('cte-multiselect-bar');
  const selectedCountEl = document.getElementById('cte-selected-count');
  const multiDoneBtn = document.getElementById('cte-multi-done-btn');
  const multiCancelBtn = document.getElementById('cte-multi-cancel-btn');
  const imagePreviewWrap = document.getElementById('cte-image-preview-wrap');
  const imagePreview = document.getElementById('cte-image-preview');
  const targetTypeEl = document.getElementById('cte-target-type');
  const targetSelectorEl = document.getElementById('cte-target-selector');
  const targetPreviewEl = document.getElementById('cte-target-preview');
  const toast = document.getElementById('cte-toast');

  // Annotation Editor Elements
  const annotModalBackdrop = document.getElementById('cte-annot-modal-backdrop');
  const annotCanvas = document.getElementById('cte-annot-canvas');
  const annotCtx = annotCanvas.getContext('2d');
  const annotUndoBtn = document.getElementById('cte-annot-undo');
  const annotClearBtn = document.getElementById('cte-annot-clear');
  const annotCancelBtn = document.getElementById('cte-annot-cancel');
  const annotCloseBtn = document.getElementById('cte-annot-close-btn');
  const annotSaveBtn = document.getElementById('cte-annot-save');
  const colorBtns = document.querySelectorAll('.cte-color-btn');
  const sizeBtns = document.querySelectorAll('.cte-size-btn');

  let isInspectMode = false;
  let currentMode = null; // 'click' | 'crop' | 'capture'
  let capturedData = null;
  let capturedBlob = null;
  let capturedBase64 = null;
  let isAreaMouseDown = false;
  let cropStartX = 0, cropStartY = 0;

  // Drawing state
  let drawColor = '#ef4444';
  let drawSize = 4;
  let isDrawing = false;
  let lastDrawX = 0, lastDrawY = 0;
  let undoStack = [];
  const maxUndo = 15;

  const PADDING = 12;

  // Suppress any global tooltip system over CTE
  container.addEventListener('mouseenter', () => {
    if (typeof Tooltip !== 'undefined' && typeof Tooltip.hide === 'function') {
      Tooltip.hide();
    }
  });

  // --- SMART POPOVER POSITIONING ---
  function updatePopoverPosition() {
    const rect = container.getBoundingClientRect();
    const popoverWidth = 210;
    const popoverHeight = 175;

    if (rect.left + popoverWidth > window.innerWidth - PADDING) {
      popover.style.left = 'auto';
      popover.style.right = '0px';
    } else {
      popover.style.right = 'auto';
      popover.style.left = '0px';
    }

    if (rect.top - popoverHeight < PADDING) {
      popover.style.bottom = 'auto';
      popover.style.top = '48px';
    } else {
      popover.style.top = 'auto';
      popover.style.bottom = '48px';
    }
  }

  // --- DRAG LOGIC FOR FAB ---
  let isDraggingFab = false;
  let hasMoved = false;
  let suppressNextClick = false;
  let dragStartX = 0, dragStartY = 0;
  let initialLeft = 0, initialTop = 0;

  function clampPosition(left, top) {
    const maxLeft = window.innerWidth - 42 - PADDING;
    const maxTop = window.innerHeight - 42 - PADDING;
    return {
      x: Math.max(PADDING, Math.min(left, maxLeft)),
      y: Math.max(PADDING, Math.min(top, maxTop))
    };
  }

  fab.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    isDraggingFab = true;
    hasMoved = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;

    container.classList.add('cte-dragging');

    const rect = container.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    container.style.bottom = 'auto';
    container.style.right = 'auto';
    container.style.left = initialLeft + 'px';
    container.style.top = initialTop + 'px';

    fab.setPointerCapture(e.pointerId);
  });

  fab.addEventListener('pointermove', (e) => {
    if (!isDraggingFab) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;

    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      hasMoved = true;
      // Close menu immediately as soon as dragging begins
      popover.classList.remove('show');
    }

    if (hasMoved) {
      const clamped = clampPosition(initialLeft + dx, initialTop + dy);
      container.style.left = clamped.x + 'px';
      container.style.top = clamped.y + 'px';
    }
  });

  fab.addEventListener('pointerup', (e) => {
    if (!isDraggingFab) return;
    isDraggingFab = false;
    try { fab.releasePointerCapture(e.pointerId); } catch(err) {}

    container.classList.remove('cte-dragging');

    if (hasMoved) {
      suppressNextClick = true;
      setTimeout(() => { suppressNextClick = false; }, 150);

      // Snap to nearest of all 4 edges (Left, Right, Top, Bottom)
      const rect = container.getBoundingClientRect();
      const currentX = rect.left;
      const currentY = rect.top;

      const minX = PADDING;
      const maxX = window.innerWidth - rect.width - PADDING;
      const minY = PADDING;
      const maxY = window.innerHeight - rect.height - PADDING;

      const distLeft = Math.abs(currentX - minX);
      const distRight = Math.abs(maxX - currentX);
      const distTop = Math.abs(currentY - minY);
      const distBottom = Math.abs(maxY - currentY);

      const minDist = Math.min(distLeft, distRight, distTop, distBottom);

      let targetLeft = currentX;
      let targetTop = currentY;

      if (minDist === distLeft) {
        targetLeft = minX;
      } else if (minDist === distRight) {
        targetLeft = maxX;
      } else if (minDist === distTop) {
        targetTop = minY;
      } else {
        targetTop = maxY;
      }

      targetLeft = Math.max(minX, Math.min(targetLeft, maxX));
      targetTop = Math.max(minY, Math.min(targetTop, maxY));

      container.style.left = targetLeft + 'px';
      container.style.top = targetTop + 'px';

      // Keep menu closed after drag
      popover.classList.remove('show');
    } else {
      if (isInspectMode) {
        stopInspect();
      } else {
        updatePopoverPosition();
        popover.classList.toggle('show');
      }
    }
  });

  window.addEventListener('resize', () => {
    const rect = container.getBoundingClientRect();
    const clamped = clampPosition(rect.left, rect.top);
    container.style.left = clamped.x + 'px';
    container.style.top = clamped.y + 'px';
    updatePopoverPosition();
  });

  let toastTimer = null;
  function showToast(msg) {
    if (toastTimer) clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.style.display = 'block';
    toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2800);
  }

  let selectedElements = [];

  function clearMultiBoxes() {
    document.querySelectorAll('.cte-multi-box').forEach(b => b.remove());
    selectedElements = [];
    if (selectedCountEl) selectedCountEl.textContent = '0';
  }

  function updateMultiBoxPositions() {
    selectedElements.forEach(item => {
      if (item.el && item.boxEl) {
        const rect = item.el.getBoundingClientRect();
        item.boxEl.style.top = rect.top + 'px';
        item.boxEl.style.left = rect.left + 'px';
        item.boxEl.style.width = rect.width + 'px';
        item.boxEl.style.height = rect.height + 'px';
      }
    });
  }
  window.addEventListener('scroll', updateMultiBoxPositions, true);
  window.addEventListener('resize', updateMultiBoxPositions, true);

  function startInspect(mode) {
    if (document.activeElement && typeof document.activeElement.blur === 'function' && !document.activeElement.closest?.('#cte-container')) {
      document.activeElement.blur();
    }
    currentMode = mode;
    isInspectMode = true;
    popover.classList.remove('show');
    fab.classList.add('active');
    document.body.style.cursor = 'crosshair';

    optClick.classList.toggle('active', mode === 'click');
    optCrop.classList.toggle('active', mode === 'crop');
    optCapture.classList.toggle('active', mode === 'capture');

    if (mode === 'click') {
      clearMultiBoxes();
      if (multiSelectBar) multiSelectBar.classList.add('show');
    } else {
      if (multiSelectBar) multiSelectBar.classList.remove('show');
    }
  }

  function stopInspect() {
    isInspectMode = false;
    currentMode = null;
    fab.classList.remove('active');
    highlightBox.style.display = 'none';
    cropBox.style.display = 'none';
    if (multiSelectBar) multiSelectBar.classList.remove('show');
    document.body.style.cursor = '';
    isAreaMouseDown = false;
    optClick.classList.remove('active');
    optCrop.classList.remove('active');
    optCapture.classList.remove('active');
  }

  function toggleSelectElement(el) {
    if (!el || el.closest('.cte-ui')) return;

    const existingIdx = selectedElements.findIndex(it => it.el === el);
    if (existingIdx !== -1) {
      selectedElements[existingIdx].boxEl.remove();
      selectedElements.splice(existingIdx, 1);
      selectedElements.forEach((it, idx) => {
        it.badgeEl.textContent = idx + 1;
      });
      if (selectedCountEl) selectedCountEl.textContent = selectedElements.length;
      return;
    }

    const rect = el.getBoundingClientRect();
    const box = document.createElement('div');
    box.className = 'cte-multi-box cte-ui';
    box.style.top = rect.top + 'px';
    box.style.left = rect.left + 'px';
    box.style.width = rect.width + 'px';
    box.style.height = rect.height + 'px';

    const badge = document.createElement('span');
    badge.className = 'cte-multi-badge cte-ui';
    badge.textContent = selectedElements.length + 1;
    box.appendChild(badge);

    document.body.appendChild(box);

    const selector = getSelector(el);
    const component = getComponentName(el);
    const textPreview = (el.innerText || '').slice(0, 100).trim();

    selectedElements.push({
      el: el,
      boxEl: box,
      badgeEl: badge,
      selector: selector,
      component: component,
      type: el.tagName.toLowerCase(),
      preview: textPreview || el.outerHTML.slice(0, 80)
    });

    if (selectedCountEl) selectedCountEl.textContent = selectedElements.length;
  }

  function finishMultiSelect() {
    if (selectedElements.length === 0) {
      showToast('กรุณาคลิกเลือกอย่างน้อย 1 จุดบนหน้าจอ');
      return;
    }

    capturedBlob = null;
    capturedBase64 = null;

    if (selectedElements.length === 1) {
      const single = selectedElements[0];
      capturedData = {
        isImage: false,
        isMulti: false,
        type: `<${single.type}>`,
        component: single.component || '',
        selector: single.selector,
        preview: single.preview
      };
    } else {
      capturedData = {
        isImage: false,
        isMulti: true,
        items: selectedElements.map((it, idx) => ({
          index: idx + 1,
          type: it.type,
          component: it.component || '',
          selector: it.selector,
          preview: it.preview
        })),
        type: `หลายจุด (${selectedElements.length} จุด)`,
        selector: selectedElements.map((it, idx) => `[${idx+1}] ${it.selector}`).join('\n'),
        preview: selectedElements.map((it, idx) => `[${idx+1}] ${it.preview}`).join(' | ')
      };
    }

    stopInspect();
    openModal();
  }

  if (multiDoneBtn) {
    multiDoneBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      finishMultiSelect();
    });
  }

  if (multiCancelBtn) {
    multiCancelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      stopInspect();
      clearMultiBoxes();
      showToast('ยกเลิกการเลือกจุด');
    });
  }

  optClick.addEventListener('click', (e) => {
    e.stopPropagation();
    startInspect('click');
  });

  optCrop.addEventListener('click', (e) => {
    e.stopPropagation();
    startInspect('crop');
  });

  optCapture.addEventListener('click', (e) => {
    e.stopPropagation();
    startInspect('capture');
  });

  optCancel.addEventListener('click', (e) => {
    e.stopPropagation();
    popover.classList.remove('show');
    stopInspect();
  });

  function isTypingContext(target) {
    const el = target || document.activeElement;
    if (!el) return false;
    const tag = el.tagName ? el.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
    if (el.isContentEditable) return true;
    if (typeof el.closest === 'function' && el.closest('[contenteditable="true"]')) return true;
    return false;
  }

  window.addEventListener('keydown', (e) => {
    // 1. คีย์ลัด 1, 2, 3 สามารถกดใช้งานได้ทันทีโดยไม่ต้องเปิดเมนูก่อน (และใช้งานในเมนูได้เช่นกัน)
    const isPopoverOpen = popover.classList.contains('show');
    const isTyping = !isPopoverOpen && (isTypingContext(e.target) || isTypingContext(document.activeElement));
    const isModifier = e.ctrlKey || e.altKey || e.metaKey;
    const isCteModalOpen = modalBackdrop.classList.contains('show') || annotModalBackdrop.classList.contains('show');

    if (!isTyping && !isModifier && !isCteModalOpen && !e.shiftKey) {
      const isDigit1 = (e.key === '1' || e.code === 'Digit1' || e.code === 'Numpad1');
      const isDigit2 = (e.key === '2' || e.code === 'Digit2' || e.code === 'Numpad2');
      const isDigit3 = (e.key === '3' || e.code === 'Digit3' || e.code === 'Numpad3');

      if (isDigit1) {
        e.preventDefault();
        if (isInspectMode && currentMode === 'click' && !popover.classList.contains('show')) {
          stopInspect();
        } else {
          startInspect('click');
        }
        return;
      } else if (isDigit2) {
        e.preventDefault();
        if (isInspectMode && currentMode === 'crop' && !popover.classList.contains('show')) {
          stopInspect();
        } else {
          startInspect('crop');
        }
        return;
      } else if (isDigit3) {
        e.preventDefault();
        if (isInspectMode && currentMode === 'capture' && !popover.classList.contains('show')) {
          stopInspect();
        } else {
          startInspect('capture');
        }
        return;
      }
    }

    if (e.key === 'Escape') {
      if (annotModalBackdrop.classList.contains('show')) {
        e.preventDefault();
        annotModalBackdrop.classList.remove('show');
      } else if (modalBackdrop.classList.contains('show')) {
        e.preventDefault();
        closeModal();
      } else if (isInspectMode) {
        e.preventDefault();
        stopInspect();
        clearMultiBoxes();
        showToast('ยกเลิกการเลือกจุด');
      } else if (popover.classList.contains('show')) {
        e.preventDefault();
        popover.classList.remove('show');
      } else {
        // ตรวจสอบว่าหน้าต่าง Modal หรือ Search ของระบบหลักเปิดอยู่หรือไม่
        const hasAppModal = Boolean(
          document.getElementById('modal-backdrop') ||
          document.querySelector('.modal-backdrop:not(.cte-ui)') ||
          document.querySelector('.needs-drawer.active') ||
          document.querySelector('.needs-drawer-backdrop.active') ||
          document.querySelector('.gs-modal.active, .gs-backdrop.active')
        );
        if (hasAppModal || e.defaultPrevented) return;

        e.preventDefault();
        if (document.activeElement && typeof document.activeElement.blur === 'function' && !document.activeElement.closest?.('#cte-container')) {
          document.activeElement.blur();
        }
        updatePopoverPosition();
        popover.classList.add('show');
      }
    } else if (e.key === 'Enter') {
      if (isInspectMode && currentMode === 'click') {
        e.preventDefault();
        finishMultiSelect();
        return;
      }
      if (annotModalBackdrop.classList.contains('show')) {
        if (e.target === annotCancelBtn || e.target === annotCloseBtn) return;
        e.preventDefault();
        annotSaveBtn.click();
      } else if (modalBackdrop.classList.contains('show')) {
        if (e.target === modalCancelBtn || e.target === modalCloseBtn) return;
        if (e.shiftKey) {
          // Shift+Enter ใน textarea: อนุญาตให้ขึ้นบรรทัดใหม่ตามปกติ
          return;
        }
        e.preventDefault();
        modalSendBtn.click();
      }
    }
  });

  window.addEventListener('click', (e) => {
    if (suppressNextClick) {
      e.stopPropagation();
      return;
    }
    if (!e.target.closest('#cte-container')) {
      popover.classList.remove('show');
    }
  }, true);

  function getComponentName(el) {
    if (!el || el.nodeType !== Node.ELEMENT_NODE) return '';
    try {
      const directAttr = el.getAttribute('data-component') || el.getAttribute('data-testid');
      if (directAttr) return directAttr;

      // Check React Fiber (React 16-19)
      let cur = el;
      for (let depth = 0; cur && depth < 4; depth++, cur = cur.parentElement) {
        const keys = Object.keys(cur);
        const fiberKey = keys.find(k => k.startsWith('__reactFiber$') || k.startsWith('__reactInternalInstance$'));
        if (fiberKey) {
          let fiber = cur[fiberKey];
          let hops = 0;
          while (fiber && hops < 25) {
            const type = fiber.type;
            if (type && typeof type !== 'string') {
              const name = type.displayName || type.name || (type.render && (type.render.displayName || type.render.name));
              if (name && !/^(Fragment|Suspense|StrictMode|Provider|Consumer|Context|Anonymous|MotionComponent)$/i.test(name) && name.length > 1) {
                return name;
              }
            }
            fiber = fiber.return;
            hops++;
          }
        }
        // Check Vue 3 / Vue 2
        if (cur.__vueParentComponent && cur.__vueParentComponent.type) {
          const vName = cur.__vueParentComponent.type.name || cur.__vueParentComponent.type.__name;
          if (vName) return vName;
        }
        if (cur.__vue__ && cur.__vue__.$options && cur.__vue__.$options.name) {
          return cur.__vue__.$options.name;
        }
      }

      const attrLabel = el.getAttribute('aria-label');
      if (attrLabel) return `aria:"${attrLabel.slice(0, 28)}"`;
    } catch (e) {}
    return '';
  }

  function sanitizeCssColors(cssText) {
    if (!cssText) return cssText;
    return cssText
      .replace(/color-mix\([^()]*(?:\([^()]*\)[^()]*)*\)/g, 'rgba(148, 163, 184, 0.35)')
      .replace(/oklab\([^()]*(?:\([^()]*\)[^()]*)*\)/g, '#0095DA')
      .replace(/oklch\([^()]*(?:\([^()]*\)[^()]*)*\)/g, '#0095DA')
      .replace(/\blab\([^()]*(?:\([^()]*\)[^()]*)*\)/g, '#0095DA')
      .replace(/\blch\([^()]*(?:\([^()]*\)[^()]*)*\)/g, '#0095DA');
  }

  async function copyTextFallback(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.className = 'cte-ui';
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) {
      return false;
    }
  }

  async function postToCteServer(endpoint, payload) {
    const rawBase = typeof window.__CTE_API_BASE__ === 'string'
      ? window.__CTE_API_BASE__.trim().replace(/\/+$/, '')
      : '';
    const urls = [];
    if (rawBase) {
      urls.push(rawBase + endpoint);
    } else {
      if (window.location && window.location.protocol !== 'file:') {
        urls.push(endpoint);
      }
      const sidecarBase = 'http://localhost:4899';
      if (!window.location || window.location.origin !== sidecarBase) {
        urls.push(sidecarBase + endpoint);
      }
    }

    for (const url of urls) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) return true;
      } catch (e) {}
    }
    return false;
  }

  function getSelector(el) {
    if (!el || el === document.body) return 'body';
    if (el.id) return '#' + el.id;
    let path = [];
    while (el && el.nodeType === Node.ELEMENT_NODE && el !== document.body) {
      let selector = el.nodeName.toLowerCase();
      if (el.className && typeof el.className === 'string') {
        const classes = el.className.trim().split(/\s+/).filter(c => c && !c.startsWith('cte-')).slice(0, 2);
        if (classes.length) selector += '.' + classes.join('.');
      }
      path.unshift(selector);
      el = el.parentNode;
      if (path.length >= 3) break;
    }
    return path.join(' > ');
  }

  // --- MOUSE MOVE ---
  window.addEventListener('mousemove', (e) => {
    if (!isInspectMode) return;

    if (currentMode === 'click') {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (!el || el.closest('.cte-ui')) {
        highlightBox.style.display = 'none';
        return;
      }
      const rect = el.getBoundingClientRect();
      highlightBox.style.top = rect.top + 'px';
      highlightBox.style.left = rect.left + 'px';
      highlightBox.style.width = rect.width + 'px';
      highlightBox.style.height = rect.height + 'px';
      highlightBox.style.display = 'block';

      const tag = el.tagName.toLowerCase();
      const comp = getComponentName(el);
      const text = (el.innerText || '').trim().replace(/\s+/g, ' ').slice(0, 24);
      highlightBadge.textContent = `<${tag}>${comp ? ` [${comp}]` : ''} ${text ? `"${text}"` : ''}`;
    } else if ((currentMode === 'crop' || currentMode === 'capture') && isAreaMouseDown) {
      const curX = e.clientX;
      const curY = e.clientY;
      const left = Math.min(cropStartX, curX);
      const top = Math.min(cropStartY, curY);
      const width = Math.abs(curX - cropStartX);
      const height = Math.abs(curY - cropStartY);

      cropBox.style.left = left + 'px';
      cropBox.style.top = top + 'px';
      cropBox.style.width = width + 'px';
      cropBox.style.height = height + 'px';
      cropBox.style.display = 'block';
    }
  }, true);

  // --- AREA DRAG START / END ---
  window.addEventListener('mousedown', (e) => {
    if (!isInspectMode || (currentMode !== 'crop' && currentMode !== 'capture')) return;
    if (e.target.closest('.cte-ui')) return;
    e.preventDefault();
    e.stopPropagation();
    isAreaMouseDown = true;
    cropStartX = e.clientX;
    cropStartY = e.clientY;
  }, true);

  window.addEventListener('mouseup', async (e) => {
    if (!isInspectMode || (currentMode !== 'crop' && currentMode !== 'capture') || !isAreaMouseDown) return;
    e.preventDefault();
    e.stopPropagation();
    isAreaMouseDown = false;

    const endX = e.clientX;
    const endY = e.clientY;
    const rect = {
      left: Math.min(cropStartX, endX),
      top: Math.min(cropStartY, endY),
      width: Math.abs(endX - cropStartX),
      height: Math.abs(endY - cropStartY)
    };

    cropBox.style.display = 'none';

    if (rect.width < 12 || rect.height < 12) {
      return;
    }

    const centerEl = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
    const selector = centerEl ? getSelector(centerEl) : 'Screen Area';
    const component = centerEl ? getComponentName(centerEl) : '';

    if (currentMode === 'crop') {
      stopInspect();
      capturedBlob = null;
      capturedBase64 = null;
      capturedData = {
        isImage: false,
        type: 'ครอบพื้นที่ (Area Selection)',
        component: component,
        selector: selector,
        preview: `พิกัดพื้นที่: ${Math.round(rect.width)}x${Math.round(rect.height)} px (${centerEl ? centerEl.tagName.toLowerCase() : 'element'})`
      };
      openModal();

    } else if (currentMode === 'capture') {
      stopInspect();
      showToast('กำลังประมวลผลภาพ...');

      const cteEls = document.querySelectorAll('.cte-ui');
      cteEls.forEach(el => el.style.visibility = 'hidden');

      try {
        if (typeof html2canvas === 'undefined') {
          throw new Error('html2canvas not loaded');
        }

        const scrollX = window.scrollX || window.pageXOffset || 0;
        const scrollY = window.scrollY || window.pageYOffset || 0;

        const canvas = await html2canvas(document.body, {
          x: rect.left + scrollX,
          y: rect.top + scrollY,
          width: rect.width,
          height: rect.height,
          windowWidth: window.innerWidth,
          windowHeight: window.innerHeight,
          useCORS: true,
          logging: false,
          onclone: (clonedDoc) => {
            try {
              // 1. Sanitize style tags (Tailwind v4 oklch/oklab/color-mix)
              const styles = clonedDoc.querySelectorAll('style');
              styles.forEach(s => {
                if (s.textContent && /(oklab|oklch|color-mix|\blab\(|\blch\()/.test(s.textContent)) {
                  s.textContent = sanitizeCssColors(s.textContent);
                }
              });
              // 2. Sanitize CSSStyleSheets rules
              try {
                for (let i = 0; i < clonedDoc.styleSheets.length; i++) {
                  const sheet = clonedDoc.styleSheets[i];
                  try {
                    const rules = sheet.cssRules || sheet.rules;
                    if (rules) {
                      for (let r = 0; r < rules.length; r++) {
                        const rule = rules[r];
                        if (rule.cssText && /(oklab|oklch|color-mix|\blab\(|\blch\()/.test(rule.cssText)) {
                          const sanitized = sanitizeCssColors(rule.cssText);
                          sheet.deleteRule(r);
                          sheet.insertRule(sanitized, r);
                        }
                      }
                    }
                  } catch(e) {}
                }
              } catch(e) {}
              // 3. Sanitize inline element styles
              const all = clonedDoc.querySelectorAll('*');
              all.forEach(el => {
                if (el.style) {
                  ['color', 'backgroundColor', 'borderColor', 'outlineColor', 'fill', 'stroke'].forEach(prop => {
                    const val = el.style[prop];
                    if (val && /(oklab|oklch|color-mix|\blab\(|\blch\()/.test(val)) {
                      el.style[prop] = '';
                    }
                  });
                }
              });
            } catch(e) {}
          }
        });

        cteEls.forEach(el => el.style.visibility = '');

        capturedBase64 = canvas.toDataURL('image/png');

        await new Promise(resolve => {
          canvas.toBlob((blob) => {
            capturedBlob = blob;
            resolve();
          }, 'image/png');
        });

        capturedData = {
          isImage: true,
          type: 'ภาพหน้าจอ (Screenshot)',
          component: component,
          selector: selector,
          preview: `ขนาด ${Math.round(rect.width)}x${Math.round(rect.height)} px`
        };

        openModal();

      } catch(err) {
        cteEls.forEach(el => el.style.visibility = '');
        console.error('Screenshot error:', err);
        showToast('ไม่สามารถเรนเดอร์ภาพได้ แต่บันทึกพิกัดพื้นที่ให้แล้ว');
        capturedData = {
          isImage: false,
          type: 'ครอบพื้นที่ (Area Selection)',
          component: component,
          selector: selector,
          preview: `พิกัดพื้นที่: ${Math.round(rect.width)}x${Math.round(rect.height)} px (${centerEl ? centerEl.tagName.toLowerCase() : 'element'})`
        };
        openModal();
      }
    }

  }, true);

  // --- CLICK SELECT (MULTI-POINT SUPPORT) ---
  window.addEventListener('click', (e) => {
    if (!isInspectMode || currentMode !== 'click') return;
    if (e.target.closest('.cte-ui')) return;

    e.preventDefault();
    e.stopPropagation();

    const el = e.target;
    toggleSelectElement(el);
  }, true);

  function openModal() {
    if (!capturedData) return;

    if (capturedData.isImage) {
      modalHeading.textContent = 'ภาพที่แคปได้และคำสั่งแก้ไข';
      submitBtnText.textContent = 'คัดลอกรูปภาพและคำสั่ง';
      metaBox.style.display = 'none';
      if (multiTargetsWrap) multiTargetsWrap.style.display = 'none';
      imagePreviewWrap.style.display = 'flex';
      imagePreview.src = capturedBase64;
    } else if (capturedData.isMulti) {
      modalHeading.textContent = `ระบุคำสั่งแก้ไขสำหรับ ${capturedData.items.length} จุดที่เลือกพร้อมกัน`;
      submitBtnText.textContent = 'บันทึกและคัดลอกคำสั่ง';
      metaBox.style.display = 'none';
      imagePreviewWrap.style.display = 'none';
      if (multiTargetsWrap) {
        multiTargetsWrap.style.display = 'flex';
        multiTargetsWrap.innerHTML = capturedData.items.map(it => `
          <div class="cte-multi-target-item cte-ui">
            <span class="cte-multi-target-idx cte-ui">${it.index}</span>
            <div class="cte-multi-target-content cte-ui">
              <div class="cte-multi-target-tag cte-ui">&lt;${it.type}&gt;${it.component ? ` [${it.component}]` : ''} ${it.selector}</div>
              <div class="cte-multi-target-preview cte-ui">${it.preview ? `"${it.preview}"` : '(ไม่มีข้อความ)'}</div>
            </div>
          </div>
        `).join('');
      }
    } else {
      modalHeading.textContent = 'ระบุคำสั่งแก้ไขสำหรับจุดนี้';
      submitBtnText.textContent = 'บันทึกและคัดลอกคำสั่ง';
      metaBox.style.display = 'block';
      if (multiTargetsWrap) multiTargetsWrap.style.display = 'none';
      imagePreviewWrap.style.display = 'none';
      targetTypeEl.textContent = capturedData.component
        ? `${capturedData.type} (${capturedData.component})`
        : capturedData.type;
      targetSelectorEl.textContent = capturedData.selector;
      targetPreviewEl.textContent = capturedData.preview;
    }

    instructionInput.value = sessionStorage.getItem('cte_draft_instruction') || '';
    modalBackdrop.classList.add('show');
    setTimeout(() => instructionInput.focus(), 60);
  }

  instructionInput.addEventListener('input', () => {
    try { sessionStorage.setItem('cte_draft_instruction', instructionInput.value); } catch (e) {}
  });

  function closeModal() {
    modalBackdrop.classList.remove('show');
    clearMultiBoxes();
    try { sessionStorage.removeItem('cte_draft_instruction'); } catch (e) {}
    if (window.__ctePendingReload) {
      window.__ctePendingReload = false;
      setTimeout(() => location.reload(), 650);
    }
  }

  window.__cteShouldDeferReload = () =>
    modalBackdrop.classList.contains('show') ||
    annotModalBackdrop.classList.contains('show') ||
    isInspectMode ||
    isCropMode;

  window.__cteNotifyPendingReload = () => {
    showToast('โค้ดอัปเดตแล้ว — พักการรีเฟรชไว้จนกว่าจะปิดหน้าต่างนี้');
  };

  modalCloseBtn.addEventListener('click', closeModal);
  modalCancelBtn.addEventListener('click', closeModal);

  // --- ANNOTATION / DRAWING EDITOR LOGIC ---
  imagePreviewWrap.addEventListener('click', () => {
    if (!capturedBase64) return;
    const img = new Image();
    img.onload = () => {
      annotCanvas.width = img.naturalWidth || img.width;
      annotCanvas.height = img.naturalHeight || img.height;
      annotCtx.clearRect(0, 0, annotCanvas.width, annotCanvas.height);
      annotCtx.drawImage(img, 0, 0);
      undoStack = [annotCtx.getImageData(0, 0, annotCanvas.width, annotCanvas.height)];
      annotModalBackdrop.classList.add('show');
    };
    img.src = capturedBase64;
  });

  colorBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      colorBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      drawColor = btn.getAttribute('data-color');
    });
  });

  sizeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      sizeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      drawSize = parseInt(btn.getAttribute('data-size'), 10) || 4;
    });
  });

  function getCanvasPos(e) {
    const rect = annotCanvas.getBoundingClientRect();
    const scaleX = annotCanvas.width / rect.width;
    const scaleY = annotCanvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  annotCanvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    isDrawing = true;
    const pos = getCanvasPos(e);
    lastDrawX = pos.x;
    lastDrawY = pos.y;

    if (undoStack.length >= maxUndo) undoStack.shift();
    undoStack.push(annotCtx.getImageData(0, 0, annotCanvas.width, annotCanvas.height));

    annotCtx.beginPath();
    annotCtx.arc(lastDrawX, lastDrawY, drawSize / 2, 0, Math.PI * 2);
    annotCtx.fillStyle = drawColor;
    annotCtx.fill();

    annotCanvas.setPointerCapture(e.pointerId);
  });

  annotCanvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    const pos = getCanvasPos(e);

    annotCtx.beginPath();
    annotCtx.moveTo(lastDrawX, lastDrawY);
    annotCtx.lineTo(pos.x, pos.y);
    annotCtx.strokeStyle = drawColor;
    annotCtx.lineWidth = drawSize;
    annotCtx.lineCap = 'round';
    annotCtx.lineJoin = 'round';
    annotCtx.stroke();

    lastDrawX = pos.x;
    lastDrawY = pos.y;
  });

  annotCanvas.addEventListener('pointerup', (e) => {
    if (!isDrawing) return;
    isDrawing = false;
    try { annotCanvas.releasePointerCapture(e.pointerId); } catch(err) {}
  });

  annotUndoBtn.addEventListener('click', () => {
    if (undoStack.length > 1) {
      const prev = undoStack.pop();
      annotCtx.putImageData(prev, 0, 0);
    }
  });

  annotClearBtn.addEventListener('click', () => {
    if (undoStack.length > 0) {
      const initial = undoStack[0];
      undoStack = [initial];
      annotCtx.putImageData(initial, 0, 0);
    }
  });

  annotCancelBtn.addEventListener('click', () => {
    annotModalBackdrop.classList.remove('show');
  });

  annotCloseBtn.addEventListener('click', () => {
    annotModalBackdrop.classList.remove('show');
  });

  annotSaveBtn.addEventListener('click', () => {
    capturedBase64 = annotCanvas.toDataURL('image/png');
    annotCanvas.toBlob((blob) => {
      capturedBlob = blob;
    }, 'image/png');
    imagePreview.src = capturedBase64;
    annotModalBackdrop.classList.remove('show');
    showToast('บันทึกรูปวาดบนภาพเรียบร้อยแล้ว');
  });

  function buildPrompt(instruction) {
    if (capturedData && capturedData.isImage) {
      return `[คำสั่งแก้ไข UI จากภาพหน้าจอ]
- ตำแหน่งโดยประมาณ: ${capturedData.selector}${capturedData.component ? ` [${capturedData.component}]` : ''}
- รายละเอียดภาพ: ${capturedData.preview}
- สิ่งที่ต้องการให้แก้ไข: ${instruction || '(ดูรายละเอียดตามภาพที่แนบ)'}`;
    } else if (capturedData && capturedData.isMulti) {
      const itemsList = capturedData.items.map(it => `  จุดที่ ${it.index}: <${it.type}>${it.component ? ` [${it.component}]` : ''} (${it.selector})\n     ข้อความเดิม: "${it.preview}"`).join('\n');
      return `[คำสั่งแก้ไข UI - เลือกทั้งหมด ${capturedData.items.length} จุดพร้อมกัน]
ตำแหน่งและชิ้นส่วนที่เลือก:
${itemsList}

สิ่งที่ต้องการให้แก้ไข:
${instruction}`;
    } else if (capturedData) {
      return `[คำสั่งแก้ไข UI จากหน้าเว็บ]
- ตำแหน่ง: ${capturedData.selector}${capturedData.component ? `\n- Component: ${capturedData.component}` : ''}
- ชิ้นส่วน: ${capturedData.type}
- ข้อความเดิม: ${capturedData.preview}
- สิ่งที่ต้องการแก้ไข: ${instruction}`;
    }
    return instruction;
  }

  // Main Submit Button: Copy Image AND Text
  modalSendBtn.addEventListener('click', async () => {
    const instruction = instructionInput.value.trim();
    const formattedPrompt = buildPrompt(instruction);

    if (capturedData.isImage) {
      // 1. Send image and instruction to server endpoint (or sidecar fallback)
      await postToCteServer('/api/screenshot', {
        image: capturedBase64,
        instruction: instruction,
        selector: capturedData.selector,
        component: capturedData.component || '',
        timestamp: new Date().toISOString()
      });

      // 2. Write BOTH image/png AND text/plain to ClipboardItem
      let copiedSuccess = false;
      try {
        if (capturedBlob && navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
          const clipboardData = {};
          clipboardData['image/png'] = capturedBlob;
          clipboardData['text/plain'] = new Blob([formattedPrompt], { type: 'text/plain' });
          await navigator.clipboard.write([new ClipboardItem(clipboardData)]);
          copiedSuccess = true;
        }
      } catch(err) {
        copiedSuccess = await copyTextFallback(formattedPrompt);
      }

      if (!copiedSuccess) {
        await copyTextFallback(formattedPrompt);
      }

      closeModal();
      showToast('บันทึกภาพและคำสั่งแล้ว กด Ctrl+V ในแชทได้ทันที');

    } else {
      if (!instruction) {
        instructionInput.focus();
        return;
      }

      const payload = {
        timestamp: new Date().toISOString(),
        isMulti: Boolean(capturedData.isMulti),
        items: capturedData.items || null,
        type: capturedData.type,
        component: capturedData.component || '',
        selector: capturedData.selector,
        preview: capturedData.preview,
        instruction: instruction
      };

      await copyTextFallback(formattedPrompt);
      await postToCteServer('/api/edit-request', payload);

      closeModal();
      showToast('คัดลอกคำสั่งเรียบร้อยแล้ว กด Ctrl+V ในแชทได้ทันที');
    }
  });

})();
</script>
